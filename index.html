<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>bahamas countdown</title>
    <link rel="icon" href="bahamas.png" type="image/png">
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:white;
      background: 
        linear-gradient(to bottom, rgba(255,220,100,0.25) 0%, transparent 40%),
        url('https://cache.marriott.com/content/dam/marriott-digital/ak/cala/hws/n/nasak/en_us/photo/unlimited/assets/nasak-exterior-0118.jpg') center/cover no-repeat fixed;
      position: relative;
      overflow: hidden;
    }
    .wrap{
      width:min(900px, 92vw);
      padding:40px 30px;
      border-radius:28px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 70px rgba(0,0,0,0.35);
      z-index: 10;
      position: relative;
    }
    h1{
      margin:0 0 8px 0;
      font-size: clamp(32px, 5vw, 52px);
      text-transform: lowercase;
      text-align:center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
    .sub{
      opacity:0.9;
      text-align:center;
      font-size: 1.15rem;
      margin-bottom:30px;
    }
    .bigtext{
      font-size: clamp(48px, 12vw, 110px);
      font-weight:800;
      text-align:center;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      letter-spacing: -2px;
    }
    .label{
      font-size:18px;
      opacity:0.85;
      letter-spacing:0.1em;
      text-transform: lowercase;
      text-align:center;
      margin-top: -10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>bahamas countdown</h1>
    <div class="sub">april 6 • 5:30 am</div>
    
    <div class="bigtext">tomorrow</div>
    <div class="label">see u in the bahamas babe</div>
  </div>

</body>
</html>
