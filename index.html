<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>bahamas countdown</title>
  <link rel="icon" href="bahamas.png" type="image/png">
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:white;
      background: linear-gradient(160deg, #00f2ff, #0077ff, #0055cc);
      background-size: 400% 400%;
      animation: ocean 25s ease infinite;
    }
    @keyframes ocean {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .wrap{
      width:min(900px, 92vw);
      padding:30px;
      border-radius:24px;
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1{
      margin:0;
      font-size: clamp(28px, 4vw, 44px);
      text-transform: lowercase;
    }
    .sub{
      opacity:.9;
      margin-top:10px;
      font-size: 1.1rem;
    }
    .grid{
      margin-top:24px;
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:14px;
    }
    .card{
      background: rgba(255,255,255,.18);
      border-radius:18px;
      padding:18px;
      text-align:center;
      box-shadow: 0 8px 20px rgba(0,0,0,.2);
    }
    .num{
      font-size: clamp(34px, 6vw, 56px);
      font-weight:800;
      font-variant-numeric: tabular-nums;
    }
    .label{
      font-size:12px;
      opacity:.9;
      letter-spacing:.1em;
      text-transform: lowercase;
    }
    .status{
      margin-top:18px;
      opacity:.95;
      font-style: italic;
    }
    @media (max-width:700px){
      .grid{ grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>bahamas loading 🏝️</h1>
    <div class="sub">april 6 • 5:30 am</div>
    <div class="grid">
      <div class="card"><div class="num" id="days">--</div><div class="label">days</div></div>
      <div class="card"><div class="num" id="hours">--</div><div class="label">hours</div></div>
      <div class="card"><div class="num" id="mins">--</div><div class="label">minutes</div></div>
      <div class="card"><div class="num" id="secs">--</div><div class="label">seconds</div></div>
    </div>
    <div class="status" id="status">
      locked in. waves are already calling your name, bro.
    </div>
  </div>

  <script>
    const target = new Date(2026, 3, 6, 5, 30, 0);

    const els = {
      d: document.getElementById("days"),
      h: document.getElementById("hours"),
      m: document.getElementById("mins"),
      s: document.getElementById("secs"),
      status: document.getElementById("status")
    };

    function pad(n){ return String(n).padStart(2,"0"); }

    const timer = setInterval(() => {
      const now = new Date();
      let diff = target - now;

      if (diff <= 0) {
        clearInterval(timer);
        els.d.textContent = "0";
        els.h.textContent = "00";
        els.m.textContent = "00";
        els.s.textContent = "00";
        els.status.textContent = "time’s up. go touch some sand already 🏖️";
        return;
      }

      // real calendar days (what you asked for)
      const days = Math.ceil((target - now) / (1000 * 60 * 60 * 24));

      const totalSeconds = Math.floor(diff / 1000);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      els.d.textContent = days;
      els.h.textContent = pad(hours);
      els.m.textContent = pad(mins);
      els.s.textContent = pad(secs);
    }, 250);
  </script>
</body>
</html>
