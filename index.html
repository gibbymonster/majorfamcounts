<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>major family countdown</title>
    <link rel="icon" href="https://pngimg.com/d/letter_m_PNG118.png" type="image/png">
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:white;
      background:
        linear-gradient(to bottom, rgba(255,220,100,0.25) 0%, transparent 40%),
        url('https://coast2coastwithkids.com/wp-content/uploads/2024/04/5B5428DC-04DB-40A7-9FB2-D20E0E533E65_1_201_a-1200x900.jpeg') center/cover no-repeat fixed;
      position: relative;
      overflow: hidden;
    }
    .wrap{
      width:min(900px, 92vw);
      padding:40px 30px;
      border-radius:28px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 70px rgba(0,0,0,0.35);
      z-index: 10;
      position: relative;
    }
    h1{
      margin:0 0 8px 0;
      font-size: clamp(32px, 5vw, 52px);
      text-transform: lowercase;
      text-align:center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
    .sub{
      opacity:0.9;
      text-align:center;
      font-size: 1.15rem;
      margin-bottom:30px;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:16px;
    }
    .card{
      background: rgba(255,255,255,0.18);
      border-radius:20px;
      padding:22px 12px;
      text-align:center;
    }
    .num{
      font-size: clamp(38px, 7vw, 62px);
      font-weight:800;
      font-variant-numeric: tabular-nums;
    }
    .label{
      font-size:13px;
      opacity:0.85;
      letter-spacing:0.08em;
      text-transform: lowercase;
    }
    @media (max-width:700px){
      .grid{ grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>bahamas countdown</h1>
    <div class="sub">april 6 • 5:30 am</div>
   
    <div class="grid">
      <div class="card"><div class="num" id="middle">no countdowns now</div><div class="label">status</div></div>     
    </div>
  </div>

  <script>
    // timer removed, it's dead now 😂
  </script>
</body>
</html>
