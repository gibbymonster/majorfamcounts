<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>major family countdown</title>
    <link rel="icon" href="https://pngimg.com/d/letter_m_PNG118.png" type="image/png">
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:white;
      background: 
        linear-gradient(to bottom, rgba(255,220,100,0.25) 0%, transparent 40%),
        url('https://riverfrontwilm.com/wp-content/uploads/2015/04/Winterthur-1.png') center/cover no-repeat fixed;
      /* real bahamas-style ocean image: turquoise water + sand */
      position: relative;
      overflow: hidden;
    }
    .wrap{
      width:min(900px, 92vw);
      padding:40px 30px;
      border-radius:28px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 70px rgba(0,0,0,0.35);
      z-index: 10;
      position: relative;
    }
    h1{
      margin:0 0 8px 0;
      font-size: clamp(32px, 5vw, 52px);
      text-transform: lowercase;
      text-align:center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
    .sub{
      opacity:0.9;
      text-align:center;
      font-size: 1.15rem;
      margin-bottom:30px;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:16px;
    }
    .card{
      background: rgba(255,255,255,0.18);
      border-radius:20px;
      padding:22px 12px;
      text-align:center;
    }
    .num{
      font-size: clamp(38px, 7vw, 62px);
      font-weight:800;
      font-variant-numeric: tabular-nums;
    }
    .label{
      font-size:13px;
      opacity:0.85;
      letter-spacing:0.08em;
      text-transform: lowercase;
    }
    @media (max-width:700px){
      .grid{ grid-template-columns: repeat(2,1fr); }
      .sun{ top: 60px; right: 60px; width: 90px; height: 90px; }
    }
  </style>
</head>
<body>
  <div class="sun"></div>
  <div class="sand"></div>

  <div class="wrap">
    <h1>bahamas countdown</h1>
    <div class="sub">april 6 • 5:30 am</div>
    
    <div class="grid">
      <div class="card"><div class="num" id="days">--</div><div class="label">days</div></div>
      <div class="card"><div class="num" id="hours">--</div><div class="label">hours</div></div>
      <div class="card"><div class="num" id="mins">--</div><div class="label">minutes</div></div>
      <div class="card"><div class="num" id="secs">--</div><div class="label">seconds</div></div>
    </div>
  </div>

  <script>
    const target = new Date(2026, 3, 6, 5, 30, 0);

    const els = {
      d: document.getElementById("days"),
      h: document.getElementById("hours"),
      m: document.getElementById("mins"),
      s: document.getElementById("secs")
    };

    function pad(n){ return String(n).padStart(2,"0"); }

    setInterval(() => {
      const now = new Date();
      let diff = target - now;

      if (diff <= 0) {
        els.d.textContent = "0";
        els.h.textContent = "00";
        els.m.textContent = "00";
        els.s.textContent = "00";
        return;
      }

      const days = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
      const totalSeconds = Math.floor(diff / 1000);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      els.d.textContent = days;
      els.h.textContent = pad(hours);
      els.m.textContent = pad(mins);
      els.s.textContent = pad(secs);
    }, 250);
  </script>
</body>
</html>
